; PlatformIO Project Configuration File

[platformio]
default_envs = client_d1_mini_pro

[env]
framework = arduino
monitor_speed = 115200
build_flags =
  -DVIBEWUZZ_LOG_LEVEL=VIBEWUZZ_LOG_LEVEL_INFO
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.3

[env:client_d1_mini_pro]
platform = espressif8266
board = d1_mini_pro
build_src_filter =
  +<client.cpp>
